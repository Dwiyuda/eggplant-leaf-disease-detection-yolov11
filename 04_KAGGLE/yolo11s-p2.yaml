# YOLO11 dengan kepala deteksi tambahan P2/4 untuk objek kecil.
#
# penelitian -
#
# ALASAN. Pengukuran 2026-08-07 pada 8.989 kotak lesi:
#   median kotak lesi = 16 px @ imgsz 640, 25 px @ imgsz 1024
#   kepala terkecil YOLO11 bawaan = P3, stride 8
#   -> lesi cuma selebar 2 sel @640 atau 3,2 sel @1024
#   -> 50% kotak lesi berada di bawah 2 sel, praktis lantai arsitekturnya
#
# P2 berjalan pada stride 4, jadi lesi yang sama jadi 6,4 sel @1024. Ini
# menyerang batas yang sudah kita ukur, bukan menebak-nebak hyperparameter.
#
# Diadaptasi dari pola resmi ultralytics/cfg/models/v8/yolov8-p2.yaml,
# disesuaikan ke blok C3k2 dan C2PSA milik YOLO11.
#
# BIAYA. Peta fitur stride 4 berukuran 4x peta stride 8, jadi kepala ini
# jauh lebih berat dari tiga kepala lainnya digabung. Perkiraan 2-3x lebih
# lambat dan jauh lebih haus VRAM. Turunkan batch kalau CUDA OOM.

# Parameters
nc: 4 # healthy_leaf, mosaic_virus_disease, leaf_spot_disease, insect_pest_disease
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone -- IDENTIK dengan yolo11.yaml, tidak ada yang diubah.
# Bobot pretrained tetap cocok di sini; yang baru hanya bagian kepala.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2   <- keluaran P2/4, dipakai kepala baru
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head -- jalur turun diperpanjang satu tingkat sampai P2/4,
# lalu jalur naik dikembalikan sampai P5/32.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12  cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15  cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18  cat backbone P2   <-- TAMBAHAN
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)    <-- TAMBAHAN

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21  cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24  cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27  cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
